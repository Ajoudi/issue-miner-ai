name: Mine issues & deploy

on:
  schedule:
    - cron: "0 0 * * *"   # daily at 00:00 UTC
  workflow_dispatch: {}     # manual "Run workflow" button

# Least privilege: write repo contents (to commit data/) and, when enabled,
# publish Pages via OIDC.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: issueminer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Mine issues and generate site
        env:
          # GITHUB_TOKEN is injected automatically — no secret needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit accumulated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: update mined issues [skip ci]"
            git push
          fi

      # Uploading the artifact is harmless even when Pages is off.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # Gated: only runs once you enable hosting by setting repository
  # variable ENABLE_PAGES = true (Settings -> Secrets and variables -> Actions
  # -> Variables). Keeps the private-repo build green until you go live.
  deploy:
    needs: build
    if: ${{ vars.ENABLE_PAGES == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
