# IssueMiner AI — target repositories & mining strategy.
# Edit this file to steer what gets mined. No code changes required.

settings:
  # Two-tier LLM: a cheap model gates feasibility, a better model writes blueprints.
  # Use the "-latest" aliases, not pinned versions — pinned models get retired
  # (gemini-2.5-flash-lite started returning 404 "no longer available"), and the
  # 2.0 family has no free tier (limit: 0). Aliases always map to a current model.
  triage_model: "gemini-flash-lite-latest"   # Tier 1: fast/cheap feasibility gate
  blueprint_model: "gemini-flash-latest"     # Tier 2: full "how to solve it" blueprint

  # Recency: skip issues with no activity in this many days (server-side filter
  # on last-updated, not creation — an old-but-active issue still counts as live).
  # Per-repo overridable. 180 = drop anything untouched for 6 months.
  max_inactive_days: 180

  # Funnel widths (per repo).
  candidate_pool_size: 40    # issues fetched from GitHub, then heuristically ranked by NEED
  triage_pool_size: 10       # top-by-need candidates sent to the cheap triage model
  blueprint_top_n: 5         # feasible survivors (highest need) that get a full blueprint

  # Input hardening / cost control.
  issue_body_char_limit: 4000   # blueprint stage body truncation
  triage_body_char_limit: 1200  # triage stage body truncation (cheaper — fits more in free tier)
  max_comments_per_issue: 3
  reprocess_after_days: 14      # re-run only if the issue changed or is older than this
  prune_closed_issues: true     # mark now-closed issues resolved + hide them from the site

  # Global safety valves — quota can't be blown even if something misbehaves.
  max_triage_calls_per_run: 60
  max_blueprint_calls_per_run: 32

# Each repo defines a tiered label strategy. Tiers are PLAIN LABEL NAMES (not
# search syntax) so the same config works on any forge — they're tried in order
# until we have `candidate_pool_size` candidates. "" means "no label filter"
# (the reaction-ranked fallback for lightly-labeled repos). Label names must
# match the repo's own casing/prefixes exactly ("Type/Bug", not "bug").
#
# `forge:` defaults to "github". Use "gitea" + `host:` for a self-hosted Gitea
# tracker. Gitea's API is weaker than GitHub's (no reaction sort, no unassigned
# filter), so narrow curated labels matter much more there — put the
# contributor-facing labels first and leave the giant catch-all tier last.
repos:
  - name: "ollama/ollama"
    label_tiers:
      - "good first issue"
      - "help wanted"
      - "bug"
  - name: "langfuse/langfuse"
    label_tiers:
      - "bug"
      - ""
  - name: "duckdb/duckdb"
    label_tiers:
      - "bug"
      - ""
  - name: "ClickHouse/ClickHouse"
    label_tiers:
      - "bug"
      - ""

  # FreeCAD has no "Bug" label at all — its contributor-facing labels are the
  # whole point here (~145 open "Good first issue"), so there's no catch-all
  # tier: an unlabeled FreeCAD pool is mostly unactionable user reports.
  - name: "FreeCAD/FreeCAD"
    label_tiers:
      - "Good first issue"
      - "Help wanted"

  # Blender does not use GitHub — its tracker is a self-hosted Gitea instance.
  # The API is public and needs no token. "Meta/Papercut" is Blender's term for
  # small, well-defined annoyances, which is exactly our target shape; Type/Bug
  # is ~4k issues and only used if the curated tiers run dry.
  - name: "blender/blender"
    forge: gitea
    host: "https://projects.blender.org"
    label_tiers:
      - "Meta/Good First Issue"
      - "Meta/Papercut"
      - "Type/Bug"

# Issues carrying ANY of these labels are always skipped.
exclude_labels:
  - "wontfix"
  - "duplicate"
  - "invalid"
  - "question"
  - "needs triage"
  - "blocked"
  - "upstream"
  - "stale"
  - "discussion"
